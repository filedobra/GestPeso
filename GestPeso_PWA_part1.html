<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GestPeso PWA</title>
<meta name="theme-color" content="#01696f">
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#f7f6f2;--surface:#f9f8f5;--surface2:#fbfbf9;--border:#d4d1ca;--text:#28251d;--muted:#65625d;--primary:#01696f;--primary2:#0c4e54;--radius:16px;--shadow:0 10px 24px rgba(0,0,0,.08)}
[data-theme=dark]{--bg:#171614;--surface:#1c1b19;--surface2:#201f1d;--border:#393836;--text:#efedea;--muted:#a3a09b;--primary:#4f98a3;--primary2:#227f8b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,var(--bg),var(--surface));color:var(--text)}
.wrap{max-width:980px;margin:0 auto;padding:16px}.header{display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;background:color-mix(in oklab,var(--bg) 88%, transparent);backdrop-filter:blur(10px);padding:12px 0;border-bottom:1px solid color-mix(in oklab,var(--text) 10%, transparent)}
.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--primary),color-mix(in oklab,var(--primary) 65%, white));display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px rgba(1,105,111,.18)}
.logo svg{width:24px;height:24px}.name{font-size:1.15rem;font-weight:800}.sub{font-size:.88rem;color:var(--muted)}.btn{min-height:44px;padding:0 14px;border-radius:14px;border:1px solid color-mix(in oklab,var(--text) 10%, transparent);background:var(--surface)}
.primary{background:var(--primary2);color:#fff;border:none;font-weight:800}.card{margin-top:16px;background:var(--surface);border:1px solid color-mix(in oklab,var(--text) 10%, transparent);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}label{display:block;font-size:.92rem;font-weight:700;margin:6px 0}
input,textarea,select,button{font:inherit;color:inherit}input,textarea,select{width:100%;min-height:46px;padding:12px;border-radius:14px;border:1px solid color-mix(in oklab,var(--text) 12%, transparent);background:var(--surface2)}textarea{min-height:86px}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:14px}.tab{min-height:42px;border-radius:999px;border:1px solid color-mix(in oklab,var(--text) 10%, transparent);background:var(--surface)}.tab.active{background:var(--primary);color:#fff;border-color:transparent;font-weight:700}
.section{display:none}.section.active{display:block}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.box{background:var(--surface2);border:1px solid color-mix(in oklab,var(--text) 10%, transparent);border-radius:16px;padding:14px}.big{font-size:1.7rem;font-weight:800}.small{font-size:.88rem;color:var(--muted)}
.meal,.item,.exercise{padding:14px;border-radius:16px;background:var(--surface2);border:1px solid color-mix(in oklab,var(--text) 10%, transparent);margin-top:10px}.muted{color:var(--muted)} ul{padding-left:18px;margin:8px 0}.warn{color:#964219}
@media(max-width:820px){.grid,.grid3,.kpis,.tabs{grid-template-columns:1fr}.header{align-items:flex-start;flex-direction:column}.tabs{margin-top:12px}}
.print-sheet{display:none}.print-box{border:1px solid #999;border-radius:12px;min-height:56px;padding:10px;margin:8px 0}.print-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.print-line{height:36px;border-bottom:1px dashed #999;margin-top:8px}
@media print{body{background:#fff;color:#000}.header,.tabs,#themeBtn,.btn,.warn,.no-print{display:none !important}.section{display:block !important}.card{box-shadow:none}.print-sheet{display:block}.exercise,.item,.box{break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap">
<header class="header">
<div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18"/><path d="M7 8c0-2.8 2.2-5 5-5s5 2.2 5 5-2.2 5-5 5H7z"/><path d="M17 16c0 2.8-2.2 5-5 5s-5-2.2-5-5 2.2-5 5-5h5z"/></svg></div><div><div class="name">GestPeso</div><div class="sub">Profilo e progressi</div></div></div>
<button class="btn" id="themeBtn">Tema</button>
</header>
<nav class="tabs"><button class="tab active" data-tab="profilo">Profilo</button><button class="tab" data-tab="misure">Misure</button><button class="tab" data-tab="piano">Piano</button><button class="tab" data-tab="progressi">Progressi</button><button class="tab" data-tab="grafico">Grafico</button><button class="tab" data-tab="allenamento">Allenamento</button><button class="tab" data-tab="promemoria">Promemoria</button></nav>
<section id="profilo" class="section active"><div class="card"><h2>Dati iniziali</h2><div class="grid3"><div><label>Nome</label><input id="nome"></div><div><label>Età</label><input id="eta" type="number" value="58"></div><div><label>Sesso</label><select id="sesso"><option value="uomo">Uomo</option><option value="donna">Donna</option></select></div><div><label>Altezza (cm)</label><input id="altezza" type="number" value="175"></div><div><label>Peso iniziale (kg)</label><input id="pesoIniziale" type="number" step="0.1" value="87"></div><div><label>Obiettivo (kg)</label><input id="pesoObiettivo" type="number" step="0.1" value="80"></div><div><label>Passi medi/giorno</label><input id="passiMedi" type="number" value="5500"></div><div><label>Livello attività</label><select id="livello"><option value="sedentario" selected>Sedentario</option><option value="base">Base</option><option value="medio">Medio</option></select></div><div><label>Allenamento disponibile</label><select id="attrezzi"><option value="corpo_libero">Solo corpo libero</option><option value="elastici">Corpo libero + elastici</option><option value="palestra">Palestra</option></select></div><div><label>Intensità scheda</label><select id="intensita"><option value="facile">Facile</option><option value="media" selected>Media</option><option value="avanzata">Avanzata</option></select></div></div><label>Limitazioni / note salute</label><textarea id="preferenze" placeholder="Es. dolore ginocchia, mal di schiena, pressione alta..."></textarea><div class="grid" style="margin-top:12px"><button class="btn primary" id="saveProfile">Salva profilo</button><button class="btn" id="fillDemo">Compila esempio</button></div></div></section>
